<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Documentos legais da ferramenta videos-carrossel.">
    <title>videos-carrossel | Documentos legais</title>
    <style>
        :root {
            color-scheme: light;
            --background: #f4f7fb;
            --surface: #ffffff;
            --text: #172033;
            --muted: #68738a;
            --border: #dde4ef;
            --accent: #5b5bd6;
            --accent-soft: #eef0ff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background:
                radial-gradient(circle at top right, rgba(91, 91, 214, 0.12), transparent 28rem),
                var(--background);
            color: var(--text);
            font-family: Inter, "Segoe UI", Arial, sans-serif;
            line-height: 1.7;
        }

        .container {
            width: min(820px, calc(100% - 32px));
            margin: 48px auto;
        }

        .document {
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: var(--surface);
            box-shadow: 0 16px 40px rgba(31, 42, 68, 0.08);
        }

        .document-header {
            padding: 40px 48px 32px;
            border-bottom: 1px solid var(--border);
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 18px;
            color: var(--accent);
            font-size: 0.82rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .brand::before {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent);
            content: "";
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 6vw, 3.25rem);
            line-height: 1.1;
            letter-spacing: -0.04em;
        }

        .subtitle {
            margin: 12px 0 0;
            color: var(--muted);
        }

        main {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            padding: 32px 48px 48px;
        }

        .link-card {
            display: block;
            padding: 24px;
            border: 1px solid var(--border);
            border-radius: 14px;
            color: var(--text);
            text-decoration: none;
            transition: 0.2s ease;
        }

        .link-card:hover,
        .link-card:focus-visible {
            border-color: var(--accent);
            background: var(--accent-soft);
            transform: translateY(-2px);
            outline: none;
        }

        .link-card span {
            display: block;
        }

        .link-title {
            margin-bottom: 6px;
            font-size: 1.15rem;
            font-weight: 800;
        }

        .link-description {
            color: var(--muted);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        @media (max-width: 600px) {
            body {
                place-items: start center;
            }

            .container {
                width: min(100% - 20px, 820px);
                margin: 20px auto;
            }

            .document {
                border-radius: 14px;
            }

            .document-header {
                padding: 28px 24px 24px;
            }

            main {
                grid-template-columns: 1fr;
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <article class="document">
            <header class="document-header">
                <div class="brand">videos-carrossel</div>
                <h1>Documentos legais</h1>
                <p class="subtitle">Consulte as regras e informações sobre privacidade da ferramenta.</p>
            </header>

            <main>
                <a class="link-card" href="termos.html">
                    <span class="link-title">Termos de Uso</span>
                    <span class="link-description">Regras de utilização da ferramenta e responsabilidades do usuário.</span>
                </a>

                <a class="link-card" href="politica.html">
                    <span class="link-title">Política de Privacidade</span>
                    <span class="link-description">Informações sobre coleta, uso e proteção dos dados.</span>
                </a>
            </main>
        </article>
    </div>
</body>
</html>
